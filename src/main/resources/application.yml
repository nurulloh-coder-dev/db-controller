spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_controller}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: Asia/Tashkent

  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}
      password: ${REDISPASSWORD:}
      username: ${REDISUSER:default}

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: https://api.groq.com/openai
      embedding:
        api-key: ${OPENAI_API_KEY}
        base-url: https://api.openai.com
        options:
          model: text-embedding-3-small
    chat:
      model: llama-3.3-70b-versatile

server:
  port: ${PORT:8080}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: noreply@db-controller.xyz

app:
  docs-folder: "/app/app-knowledge/"
  base-folder: "/app/Agents/"
  logs-folder: "/app/logs/"
  user-register: "/app/user-registery/users.log"
  # used in password set/reset links
  frontend-url: ${FRONTEND_URL:https://db-controller.xyz}

app-security:
  token:
    # access tokens are short-lived; the frontend renews them with the refresh token
    access-exp: ${ACCESS_TOKEN_SECONDS:900}
    refresh-exp: 86400
    secret: ${SECRET_KEY}
  # comma-separated usernames allowed to use platform-wide admin endpoints
  super-admins: ${SUPER_ADMINS:}
